name: Update Trackers Blocklist

env:
  OUTPUT_FILE: "trackers.txt"
  OUTPUT_V6_FILE: "trackers_v6.txt"

on:
  schedule:
    - cron: "15 4 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream tracker list
        run: git clone --depth=1 https://github.com/ngosang/trackerslist /tmp/upstream

      - name: Extract and aggregate tracker entries
        run: |
          TMP_ALL=$(mktemp)
          TMP_V6=$(mktemp)

          # Dynamically process every trackers_*.txt in the upstream repo.
          # New files or renames are picked up automatically on the next run.
          for txt_file in /tmp/upstream/trackers_*.txt; do
            echo "Processing: $(basename "${txt_file}")"

            # Domains and IPv4: split protocol://host:port/path on '/' and ':',
            # field 4 is the hostname or bare IP.
            awk -F '[/:]' 'NF>3 && /^(udp|http|https|ws|wss)/ {print $4}' \
              "${txt_file}" >> "${TMP_ALL}"

            # IPv6: extract address from bracket notation protocol://[addr]:port/path
            grep -oE '(udp|http|https|ws|wss)://\[[^]]+\]' "${txt_file}" \
              | sed 's|.*\[||; s|\]||' >> "${TMP_V6}"
          done

          rm -rf /tmp/upstream

          # Merge with existing files to preserve any manually added entries
          cat "${OUTPUT_FILE}"    >> "${TMP_ALL}" 2>/dev/null || true
          cat "${OUTPUT_V6_FILE}" >> "${TMP_V6}"  2>/dev/null || true

          # Deduplicate, sort, and validate
          # Domains/IPv4: keep only lines starting with a letter or digit.
          # This drops malformed awk fragments like "[200" that arise when
          # the IPv6 extractor above is not used (belt-and-suspenders guard).
          sort -u "${TMP_ALL}" \
            | sed '/^[[:space:]]*$/d' \
            | grep -E '^[a-zA-Z0-9]' \
            > "${OUTPUT_FILE}"

          # IPv6: keep only lines that look like colon-separated hex groups
          sort -u "${TMP_V6}" \
            | sed '/^[[:space:]]*$/d' \
            | grep -E '^[0-9a-fA-F:]+$' \
            > "${OUTPUT_V6_FILE}"

          rm -f "${TMP_ALL}" "${TMP_V6}"

          NEW_COUNT=$(wc -l < "${OUTPUT_FILE}"    | tr -d ' ')
          V6_COUNT=$(wc -l  < "${OUTPUT_V6_FILE}" | tr -d ' ')
          echo "NEW_COUNT=${NEW_COUNT}" >> "${GITHUB_ENV}"
          echo "V6_COUNT=${V6_COUNT}"   >> "${GITHUB_ENV}"
          echo "Domains/IPv4: ${NEW_COUNT} entries, IPv6: ${V6_COUNT} entries"

      - name: Update Shields.io badge metadata
        run: |
          mkdir -p .shields
          cat > .shields/count.json <<EOF
          {
            "schemaVersion": 1,
            "label": "entries",
            "message": "${NEW_COUNT}",
            "color": "blue"
          }
          EOF

      - name: Commit and push if changed
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "${OUTPUT_FILE}" "${OUTPUT_V6_FILE}" .shields/count.json
          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "auto: Update trackers list $(date -u +'%Y-%m-%d %H:%M:%S UTC') [${NEW_COUNT} + ${V6_COUNT} IPv6]"
            git push
          fi
