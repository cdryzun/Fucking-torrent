name: Update Trackers Blocklist

env:
  OUTPUT_FILE: "trackers.txt"

on:
  schedule:
    - cron: "15 4 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and aggregate tracker lists
        run: |
          TMP_FILE=$(mktemp)

          fetch_trackers() {
            local url="$1"
            echo "Fetching: ${url}"
            curl -fsSL --retry 3 --retry-delay 5 "${url}" \
              | awk -F '[/:]' 'NF>3 && /^(udp|http|https|ws|wss)/ {print $4}' >> "${TMP_FILE}" || \
              echo "Warning: failed to fetch ${url}"
          }

          # Source 1: all standard trackers (UDP + HTTP + HTTPS + WS)
          fetch_trackers "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all.txt"

          # Source 2: WebSocket trackers — tracker.files.fm is maintained separately
          # and is intentionally excluded from trackers_all.txt by upstream
          fetch_trackers "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_ws.txt"

          # Source 3: I2P trackers — maintained separately, NOT included in trackers_all.txt
          fetch_trackers "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_i2p.txt"

          # Source 4: IP-address variants (Cloudflare IPs stripped by upstream)
          fetch_trackers "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_ip.txt"

          # Source 5: Yggdrasil network trackers — maintained separately
          fetch_trackers "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_yggdrasil.txt"

          # NOTE: trackers_all_yggdrasil_ip.txt is intentionally excluded.
          # It contains Yggdrasil-internal IPv6 addresses (e.g. [200:...], [21e:...])
          # that are not internet-routable and produce malformed entries when extracted.

          # Merge with current file to preserve any manually added entries
          cat "${OUTPUT_FILE}" >> "${TMP_FILE}" 2>/dev/null || true

          # Deduplicate, sort, strip blank lines, and validate entries.
          # Only keep lines starting with a letter or digit (hostname / IPv4).
          # This filters out malformed fragments such as "[200", "[302" that
          # result from awk splitting IPv6 tracker URLs (udp://[::1]:port/...).
          sort -u "${TMP_FILE}" \
            | sed '/^[[:space:]]*$/d' \
            | grep -E '^[a-zA-Z0-9]' \
            > "${OUTPUT_FILE}"

          rm -f "${TMP_FILE}"

          # Report stats
          NEW_COUNT=$(wc -l < "${OUTPUT_FILE}" | tr -d ' ')
          echo "NEW_COUNT=${NEW_COUNT}" >> "${GITHUB_ENV}"
          echo "Total entries after update: ${NEW_COUNT}"

      - name: Update Shields.io badge metadata
        run: |
          mkdir -p .shields
          cat > .shields/count.json <<EOF
          {
            "schemaVersion": 1,
            "label": "entries",
            "message": "${NEW_COUNT}",
            "color": "blue"
          }
          EOF

      - name: Commit and push if changed
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "${OUTPUT_FILE}" .shields/count.json
          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "auto: Update trackers list $(date -u +'%Y-%m-%d %H:%M:%S UTC') [${NEW_COUNT} entries]"
            git push
          fi
